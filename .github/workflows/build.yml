name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ startsWith(matrix.os, 'windows') }}

    strategy:
      fail-fast: false
      matrix:
        # windows-2022, not windows-latest: since June 2026 windows-latest carries
        # Visual Studio 2026 only, which node-gyp 11 (npm's, and electron-builder's
        # rebuild) cannot find — and pkcs11js, the card-signing module, is compiled
        # with it on install.
        os: [macos-latest, windows-2022]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # NOTE: no AI key is baked into the build. Releases are publicly
      # downloadable, so a bundled key could be extracted by anyone. The app
      # fetches the Anthropic key at runtime from Supabase (app_config table,
      # readable only by signed-in users).

      - name: Build and package (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run package:mac

      - name: Build and package (Windows)
        if: startsWith(matrix.os, 'windows')
        run: npm run package:win
      - name: Remove quarantine attributes (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          find release -name "*.dmg" -exec xattr -cr {} \;
          find release -name "*.app" -exec xattr -cr {} \;
      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/latest-mac.yml

      - name: Upload artifacts (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  create-release:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write
    
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-dmg
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: release-assets
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
